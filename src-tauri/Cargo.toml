[package]
name = "txuy-studio"
version = "0.1.4"
description = "AI CLI terminal workspace for Windows developers"
authors = ["txuyStudio Contributors"]
edition = "2021"

[lib]
name = "txuy_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
tauri-plugin-dialog = "2"
sysinfo = "0.32"
dirs = "6"
notify = "6"
base64 = "0.22"
