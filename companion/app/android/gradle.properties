# 堆 4G:曾用 8G+Metaspace 4G,构建启动时 Gradle 内存守门要给 worker 申请 3.8GB,
# 机器可用内存不足时(如桌面端刚构建完)会「requested 3.8G, free 3.75G, 0 released」
# 每 5s 空转死循环,15 分钟零 Task(2026-11-05 实锤 daemon 日志)。降堆即过门槛。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin/worker 守门阈值一并压低,与上面同理。
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 增量编译关闭:插件源码在 C 盘 Pub Cache、项目在 D 盘,Kotlin 2.4 的
# relocatable incremental caches 跨盘符算相对路径抛 IllegalArgumentException,必崩。
kotlin.incremental=false
